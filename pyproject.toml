[project]
name = "concevez-et-deployez-un-systeme-rag"
version = "0.1.0"
description = "POC RAG pour interroger des événements Open Agenda via FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pytest>=8.3.0",
    "faiss-cpu>=1.8.0",
    "langchain>=0.3.0",
    "langchain-community>=0.4.1,<0.4.2",
    "mistralai>=2.7.0",
    "httpx>=0.27.0",
    "ragas>=0.4.3",
    "datasets>=2.20.0",
    "litellm>=1.95.0",
    "openai>=2.48.0",
    "langchain-openai>=1.4.1",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.setuptools]
packages = ["app", "app.core", "app.evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
